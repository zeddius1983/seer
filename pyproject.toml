[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seer"
version = "1.0.0"
description = "SEER - Shell Enhanced Execution & Reasoning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["shell", "ai", "llm", "terminal", "assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/zeddius1983/seer"
Repository = "https://github.com/zeddius1983/seer"
Issues = "https://github.com/zeddius1983/seer/issues"

[project.scripts]
seer = "seer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seer"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
