# The tmux server behind `seer --tui`. It's separate from the user's own, so
# nothing here affects it. seer sets status-left and status-right as it runs.

set-option -g default-terminal "tmux-256color"

# Their keys and habits come along, except the status bar and seer's marker.
source-file -q ~/.tmux.conf
source-file -q ~/.config/tmux/tmux.conf

# The socket, not just a flag: a tmux started from one of these panes inherits
# this, and config.in_tui() must be able to tell that server from this one.
set-environment -gF SEER_TUI "#{socket_path}"

set-option -g status on
set-option -g status-interval 5
set-option -g status-style "fg=#fbf1c7,bg=default"
set-option -g status-justify centre
set-option -g status-left-length 100
set-option -g status-right-length 100
set-option -g window-status-format " #I:#W "
set-option -g window-status-current-format "#[fg=#d79921,bold] #I:#W "
